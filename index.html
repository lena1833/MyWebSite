<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NeuroEnglish — Английский с будущим</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    .overlay {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: rgba(0, 0, 0, 0.6);
    }

    h1 {
      font-size: 4rem;
      margin-bottom: 1.5rem;
      text-shadow: 0 0 15px #0ff, 0 0 25px #0ff;
      letter-spacing: 2px;
    }

    .subtitle {
      font-size: 1.5rem;
      margin-bottom: 2rem;
      color: #ff00ff;
      text-shadow: 0 0 10px #ff00ff;
    }

    .btn {
      background: transparent;
      border: 2px solid #0ff;
      color: #0ff;
      padding: 12px 30px;
      font-size: 1.2rem;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-shadow: 0 0 8px #0ff;
    }

    .btn:hover {
      background: rgba(0, 255, 255, 0.1);
      box-shadow: 0 0 20px #0ff;
      transform: scale(1.05);
    }

    .contact {
      margin-top: 2rem;
      font-size: 1.1rem;
      color: #fff;
    }

    .contact a {
      color: #ff00ff;
      text-decoration: none;
      text-shadow: 0 0 8px #ff00ff;
    }

    .contact a:hover {
      text-shadow: 0 0 15px #ff00ff;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 2.5rem;
      }
      .subtitle {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>
  <canvas id="neuralCanvas"></canvas>

  <div class="overlay">
    <h1>NeuroEnglish</h1>
    <div class="subtitle">Изучай английский с нейросетевым подходом 💡</div>
    <button class="btn" onclick="window.location.href='mailto:tutor@neuroenglish.com'">Записаться на урок</button>
    <div class="contact">
      📧 <a href="mailto:tutor@neuroenglish.com">tutor@neuroenglish.com</a> | 📱 Telegram: @neuro_english_tutor
    </div>
  </div>

  <script>
    const canvas = document.getElementById('neuralCanvas');
    const ctx = canvas.getContext('2d');

    // Адаптация под размер экрана
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Точки-нейроны
    const nodes = [];
    const colors = ['#00ffff', '#ff00ff', '#00ff00'];
    const nodeCount = 80;

    class Node {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * 0.5;
        this.vy = (Math.random() - 0.5) * 0.5;
        this.radius = Math.random() * 3 + 1;
        this.color = colors[Math.floor(Math.random() * colors.length)];
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;

        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 15;
        ctx.fill();
      }
    }

    // Инициализация нейронов
    for (let i = 0; i < nodeCount; i++) {
      nodes.push(new Node());
    }

    // Анимация
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Обновление и отрисовка нейронов
      nodes.forEach(node => {
        node.update();
        node.draw();
      });

      // Рисуем связи между близкими нейронами
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const dx = nodes[i].x - nodes[j].x;
          const dy = nodes[i].y - nodes[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < 120) {
            ctx.beginPath();
            ctx.strokeStyle = `rgba(0, 255, 255, ${1 - dist / 120})`;
            ctx.lineWidth = 1;
            ctx.moveTo(nodes[i].x, nodes[i].y);
            ctx.lineTo(nodes[j].x, nodes[j].y);
            ctx.stroke();
          }
        }
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
